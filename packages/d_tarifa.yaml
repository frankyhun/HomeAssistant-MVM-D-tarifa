################################################################################
# MVM D (dinamikus) arszabas - aktuális ár 
# Home Assistantban natív REST & template alapon.
#
# Adatforras: api.energy-charts.info (Fraunhofer ISE), HU zona day-ahead ár,
# negyedórás bontás, EUR/MWh, kulcs és regisztrácio nelkul.
# Az adat eredeti forrasa: Bundesnetzagentur | SMARD.de, CC BY 4.0
# (https://creativecommons.org/licenses/by/4.0/), változtatás nélkül.
# Ugyanezt a paros forrast (energy-charts + EKB arfolyam) hasznalja a
# holadelej.hu is, igy az ertekek egymassal osszevethetok.
#
# Keplet (MVM Next hivatalos arkepzes):
#   netto [Ft/kWh] = HUPX_negyedora [EUR/MWh] * EUR_HUF / 1000 
#                    + elosztói dij + átviteli díj
#   brutto         = netto * 1.27
#
# Telepites:
#   configuration.yaml:  homeassistant:
#                          packages: !include_dir_named packages
#   fajl helye:          /config/packages/d_tarifa.yaml
################################################################################

# FIGYELEM - elso inditas utan egyszer be kell allitani a lenti ot helper
# erteket a felhasznaloi feluleten! Az `initial:` kulcs szandekosan nincs
# hasznalva: az kikapcsolna az allapot-visszatoltest, es MINDEN HA
# ujrainditaskor visszaallitana a kezzel beirt ertekeket (pl. az MNB
# arfolyamot). `initial:` nelkul a helper a letrehozasakor a `min` erteken all,
# utana viszont megorzi a felhasznalo altal beallitott erteket.
#
# Amig ezek nincsenek beallitva, az ar-szenzorok szandekosan `unavailable`
# allapotban maradnak (lasd a `beallitva` valtozot lent) - igy nem lehet
# eszrevetlenul rossz arral szamolni.
#
# Ajanlott kezdoertekek:
#   d_atviteli_forgalmi_dij    3.39 Ft/kWh
#   d_elosztoi_forgalmi_dij   20.01 Ft/kWh
#   d_afa_kulcs               1.27
#   d_arfolyam_kezi           395  Ft
#   d_a1_referencia           70.1 Ft/kWh
input_number:
  d_atviteli_forgalmi_dij:
    name: "Átviteli forgalmi dij (netto)"
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: "Ft/kWh"
    icon: mdi:cash
    mode: box

  d_elosztoi_forgalmi_dij:
    name: "Elosztói forgalmi dij (netto)"
    min: 0
    max: 100
    step: 0.01
    unit_of_measurement: "Ft/kWh"
    icon: mdi:transmission-tower
    mode: box

  d_afa_kulcs:
    name: "AFA szorzo"
    min: 1
    max: 2
    step: 0.01
    icon: mdi:percent
    mode: box

  d_arfolyam_kezi:
    name: "EUR/HUF (kezi tartalek)"
    min: 200
    max: 800
    step: 0.01
    unit_of_measurement: "Ft"
    icon: mdi:currency-eur
    mode: box

  d_a1_referencia:
    name: "A1 savhatar feletti brutto ar"
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "Ft/kWh"
    icon: mdi:scale-balance
    mode: box

################################################################################
# REST forrasok
################################################################################
rest:
  # HUPX / HU zona day-ahead arak. A valasz:
  #   {"unix_seconds":[...], "price":[...], "unit":"EUR / MWh"}
  # A masnapi arak kb. 13:00 utan jelennek meg, ekkor a tomb egy nappal no.
  #
  # MIERT DATUMTARTOMANY, ES NEM a rovid `?bzn=HU` alak?
  # A datum nelkuli alak mindig a MAI napot keri, es 404 "no content available"
  # hibaval elszall, ha a HU zonara meg egyetlen negyedora sincs publikalva.
  # 2026-09-08-an pontosan ez tortent: a DE-LU es AT zonanak megvolt a teljes
  # napja, a HU-nak (es a SK-nak) semmi. Ilyenkor a REST sensor unavailable
  # lesz, es minden pollnal harom hibat ir a naploba (404, "REST result could
  # not be parsed as JSON", "'value_json' is undefined").
  #
  # Explicit tegnap..holnap tartomannyal a valasz akkor is 200, ha a mai nap
  # hianyzik - csak rovidebb tomb jon. Az arat ettol nem talaljuk ki: lent az
  # `eur_mwh` frissesseg-ellenorzese (1800 s) gondoskodik rola, hogy a tegnapi
  # 23:45-os ar ne szivarogjon at mai arkent.
  #
  # A `resource_template` minden frissites elott ujra renderelodik, tehat a
  # datumok maguktol tovabblepnek ejfelkor - nincs szukseg ujrainditasra.
  - resource_template: >-
      https://api.energy-charts.info/price?bzn=HU&start={{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}&end={{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}
    scan_interval: 900
    timeout: 30
    sensor:
      - name: "HUPX arak"
        unique_id: hupx_arak
        # A `value_json is defined` ellenorzes nelkul minden nem-JSON valasz
        # (404, 429 "Too Many Requests", karbantartasi HTML) template hibat dob
        # minden egyes pollnal. A datumos vegpont nincs cache-elve, ezert a 429
        # valosagos eshetoseg - 15 perces scan_interval mellett viszont bosegesen
        # a limit alatt maradunk.
        value_template: >-
          {{ value_json.price | count
          if value_json is defined and value_json.price is defined
          else 0 }}
        unit_of_measurement: "db"
        icon: mdi:chart-line
        json_attributes:
          - unix_seconds
          - price
          - unit
          - license_info
        # Ellenorzes: a "unit" attributumnak "EUR / MWh"-nak kell lennie, a
        # "db" allapot pedig 192 (tegnap + ma) vagy 288 (a masnapi arak
        # megjelenese utan). 96 = csak tegnap van meg, azaz a mai HU adat
        # hianyzik az adatforrasbol; 0 = a valasz nem is volt JSON.

  # EUR/HUF: EKB (ECB) referencia-arfolyam, ugyanaz, amit a holadelej.hu hasznal.
  # Az MVM viszont az MNB napi hivatalos kozeparfolyamaval szamol - az elteres
  # tizedszazalekos nagysagrendu. Ha pontos szamlaellenorzest akarsz, ird be
  # kezzel az MNB arfolyamot az input_number.d_arfolyam_kezi mezobe, es
  # kommenteld ki lent a fx valtozoban a sensor.eur_huf_arfolyam agat.
  - resource: "https://api.frankfurter.dev/v1/latest?from=EUR&to=HUF"
    scan_interval: 3600
    timeout: 30
    sensor:
      - name: "EUR HUF arfolyam"
        unique_id: eur_huf_arfolyam
        value_template: "{{ value_json.rates.HUF | float(0) }}"
        unit_of_measurement: "Ft"
        icon: mdi:currency-eur

################################################################################
# Ar-szenzorok
################################################################################
template:
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id:
          - sensor.hupx_arak
          - sensor.eur_huf_arfolyam
          - input_number.d_atviteli_forgalmi_dij
          - input_number.d_elosztoi_forgalmi_dij
          - input_number.d_afa_kulcs
          - input_number.d_arfolyam_kezi
          # A binary_sensor kozvetlenul olvassa. Trigger-alapu template entitas
          # csak a felsorolt entitasokat koveti, ezert triggernek is kell,
          # kulonben a kuszob modositasa csak a kovetkezo /15 tickkor hat.
          - input_number.d_a1_referencia
    action:
      - variables:
          idok: "{{ state_attr('sensor.hupx_arak', 'unix_seconds') | default([], true) }}"
          arak: "{{ state_attr('sensor.hupx_arak', 'price') | default([], true) }}"
          # az aktualis negyedora indexe: hany idobelyeg van mar mogottunk
          idx: >-
            {{ (idok | select('le', as_timestamp(now())) | list | count) - 1 }}
          # A mai naptari nap hatarai. NEM fix 86400 masodperc: DST-kor a helyi
          # nap 23 vagy 25 orabol all (92 / 100 negyedora), ezert a holnapi
          # helyi ejfelt kell kiszamolni, nem a mai ejfel + 86400-at.
          ma_eleje: "{{ as_timestamp(today_at('00:00')) }}"
          ma_vege: "{{ as_timestamp(today_at('00:00') + timedelta(days=1)) }}"
          ma_db: >-
            {{ idok | select('ge', ma_eleje | float(0)) | list
              | select('lt', ma_vege | float(0)) | list | count }}
          ma_kezdet: >-
            {{ idok | select('lt', ma_eleje | float(0)) | list | count }}
          # A mai nap nyers ar-szelete. Indexben egyutt mozog az idok tombbel,
          # ha hozzaadjuk a ma_kezdet eltolast.
          ma_arak: >-
            {{ arak[ma_kezdet | int(0) : (ma_kezdet | int(0)) + (ma_db | int(0))] }}
          # Ugyanez a szelet a hianyzo (null) ertekek nelkul: a sum/min/max
          # kulonben TypeError-t dob, ha az API publikalatlan negyedorat ad.
          ma_ervenyes: "{{ ma_arak | select('number') | list }}"
          # A `is number` ellenorzes nelkul egy null ar 0 EUR/MWh-kent jonne at
          # (float(0)), es valos, olcso arkent jelenne meg.
          # Frissesseg-ellenorzes: az `idx` mindig a legutolso mar elkezdodott
          # negyedorara mutat, ezert egy beragadt (nem frissulo) ar-tomb
          # eseten is ervenyes indexet adna - pl. a tegnapi 23:45-os arat
          # mutatna egesz nap, unavailable nelkul. Ha az aktualis negyedora
          # kezdete 30 percnel regebbi, inkabb ne mutassunk semmit.
          # A hatar azert 1800 es nem 900, hogy egy negyedora tartalek maradjon
          # a trigger futasi kesesere es az orajel-elteresre.
          eur_mwh: >-
            {% if idx | int(-1) >= 0 and arak | count > idx | int
                  and arak[idx | int] is number
                  and as_timestamp(now()) - idok[idx | int] | float(0) < 1800 %}
              {{ arak[idx | int] | float(0) }}
            {% else %}unavailable{% endif %}
          fx: >-
            {% set f = states('sensor.eur_huf_arfolyam') | float(0) %}
            {{ f if f > 0 else states('input_number.d_arfolyam_kezi') | float(395) }}
          afd: "{{ states('input_number.d_atviteli_forgalmi_dij') | float(3.39) }}"
          efd: "{{ states('input_number.d_elosztoi_forgalmi_dij') | float(20.01) }}"
          afa: "{{ states('input_number.d_afa_kulcs') | float(1.27) }}"
          netto: >-
            {% if eur_mwh == 'unavailable' %}unavailable
            {% else %}{{ eur_mwh | float(0) * fx | float(0) / 1000 + afd | float(0) + efd | float(0) }}{% endif %}
          # A helperek `initial:` nelkul az elso inditaskor a `min` erteken
          # allnak: fx=200, afa=1, afd=efd=0. Ezek onmagukban ervenyes szamok,
          # ezert a szenzor NEM lenne unavailable - csak csendben rossz (kb.
          # 36%-kal alacsonyabb) arat mutatna. Ezert explicit ellenorizzuk,
          # hogy a felhasznalo tenylegesen beallitotta-e oket.
          beallitva: >-
            {{ fx | float(0) > 250 and afa | float(0) > 1
               and afd | float(0) > 0 and efd | float(0) > 0 }}
          # Az "olcso" kuszob. A `| float(70.1)` NEM ved a be nem allitott
          # helper ellen: az `initial:` nelkuli input_number a letrehozasakor a
          # `min` erteken (0) all, az pedig ervenyes szam, tehat a float()
          # tartalek ertek soha nem lep eletbe. Igy a binary_sensor csendben
          # "0 Ft/kWh alatt olcso"-t szamolna, azaz MINDIG `off` lenne - meg 43
          # Ft/kWh-nal is. Ezert a nullat "nincs beallitva"-kent kezeljuk, es a
          # szenzor inkabb legyen unavailable, mint hamisan `off`.
          kuszob: "{{ states('input_number.d_a1_referencia') | float(0) }}"
    sensor:
      - name: "D tarifa nettó energiadíj"
        unique_id: d_tarifa_netto_energiadij
        unit_of_measurement: "Ft/kWh"
        state_class: measurement
        availability: "{{ netto != 'unavailable' and beallitva }}"
        icon: mdi:flash
        state: "{{ netto | float(0) | round(2) }}"
        attributes:
          hupx_eur_mwh: "{{ eur_mwh }}"
          arfolyam: "{{ fx | float(0) | round(2) }}"
          negyedora_index: "{{ idx }}"
          szamitva: "{{ now().isoformat() }}"

      - name: "D tarifa bruttó energiadíj"
        unique_id: d_tarifa_brutto_energiadij
        unit_of_measurement: "Ft/kWh"
        state_class: measurement
        availability: "{{ netto != 'unavailable' and beallitva }}"
        icon: mdi:cash-multiple
        state: >-
          {{ ((netto | float(0)) * afa | float(1.27)) | round(2) }}

      # Mai napi statisztika (a mai naptari naphoz tartozo szelet).
      # Az availability a tenyleges osztora nez, nem a teljes tombre: ures
      # szelet eseten unavailable lesz, nem ZeroDivisionError.
      - name: "D tarifa mai átlag brutto"
        unique_id: d_tarifa_mai_atlag_brutto
        unit_of_measurement: "Ft/kWh"
        availability: "{{ ma_ervenyes | count > 0 and beallitva }}"
        icon: mdi:chart-bell-curve
        state: >-
          {{ (((ma_ervenyes | sum / ma_ervenyes | count) * fx | float(0) / 1000
              + afd | float(0) + efd | float(0)) * afa | float(1.27)) | round(2) }}
        attributes:
          minimum: >-
            {{ (((ma_ervenyes | min) * fx | float(0) / 1000 + afd | float(0) + efd | float(0))
                * afa | float(1.27)) | round(2) }}
          maximum: >-
            {{ (((ma_ervenyes | max) * fx | float(0) / 1000 + afd | float(0) + efd | float(0))
                * afa | float(1.27)) | round(2) }}
          # A ma_arak-on beluli index + ma_kezdet eltolas adja a helyet a teljes
          # idok tombben (ma_arak csak a mai szelet).
          legolcsobb_idopont: >-
            {{ idok[(ma_kezdet | int(0)) + ma_arak.index(ma_ervenyes | min)]
               | timestamp_custom('%H:%M') }}
          legdragabb_idopont: >-
            {{ idok[(ma_kezdet | int(0)) + ma_arak.index(ma_ervenyes | max)]
               | timestamp_custom('%H:%M') }}

    binary_sensor:
      - name: "D tarifa olcso"
        unique_id: d_tarifa_olcso
        icon: mdi:piggy-bank
        availability: >-
          {{ netto != 'unavailable' and beallitva and kuszob | float(0) > 0 }}
        state: >-
          {{ ((netto | float(0)) * afa | float(1.27)) | round(2)
            < kuszob | float(0) }}
        # Diagnosztika: a tobb-more info ablakban azonnal latszik, MIVEL
        # hasonlitott ossze a szenzor. Ha a `kuszob` nem az, amit a helper
        # mezoben latsz, akkor vagy nem frissult ujra a szenzor, vagy egy masik
        # (pl. a feluleten kezzel letrehozott, duplikalt) helpert allitottal at.
        attributes:
          kuszob: "{{ kuszob | float(0) }}"
          brutto: "{{ ((netto | float(0)) * afa | float(1.27)) | round(2) }}"
          szamitva: "{{ now().isoformat() }}"

################################################################################
# Automatikus visszamenoleges potlas (opcionalis)
################################################################################
# Ha az adatforrasbol hianyzott egy idoszak, majd kesobb publikaljak, a szenzorok
# maguktol helyreallnak - de a kieses lyukkent marad a grafikonon. Ez a resz
# inditja el ilyenkor a `tools/d_tarifa_backfill.py` scriptet, ami az utolag
# publikalt arakbol kiszamolja a hianyzo orakat, es beirja oket a HA hosszu tavu
# statisztikaiba.
#
# Csak a `statistics` tabla toltheto vissza (oras atlag/min/max) - ezt hasznalja
# a `statistics-graph` kartya. A nyers `states` tortenetet a HA semmilyen
# tamogatott modon nem engedi visszaminositeni, az "Nem erheto el" marad.
#
# BEUZEMELES (harom lepes, kulonben ez a resz nem csinal semmit):
#   1. Masold a `tools/d_tarifa_backfill.py` fajlt a `/config/tools/` mappaba.
#   2. Hozz letre egy hosszu elettartamu tokent (profil -> Biztonsag), es tedd
#      egyetlen sorkent a `/config/.d_tarifa_token` fajlba. ADMIN jog kell: az
#      `import_statistics` websocket parancs `require_admin`.
#      A token szandekosan fajlbol jon, NEM a parancssorbol: a `shell_command`
#      nem nulla visszateresi ertek eseten a teljes parancsot beleirja a naploba.
#   3. Kapcsold be az `input_boolean.d_tarifa_auto_backfill` helpert.
input_boolean:
  d_tarifa_auto_backfill:
    name: "D tarifa - automatikus statisztika-potlas"
    icon: mdi:backup-restore

shell_command:
  # A HA sajat kontenereben fut, ezert a script az `aiohttp`-t hasznalja
  # websocket kliensnek - az mindig elerheto, nem kell semmit telepiteni.
  # A --budget 45 azert kell, mert a shell_command 60 masodperc utan levagja a
  # folyamatot (COMMAND_TIMEOUT) es HomeAssistantError-t dob; inkabb alljunk le
  # elotte ertelmes uzenettel.
  d_tarifa_backfill: >-
    python3 /config/tools/d_tarifa_backfill.py
    --ha-url http://127.0.0.1:8123
    --token-file /config/.d_tarifa_token
    --quiet --budget 45

automation:
  - id: d_tarifa_statisztika_potlas
    alias: "D tarifa - hianyzo ar-statisztikak potlasa"
    description: >-
      Lefuttatja a backfill scriptet, amikor az ar-szenzor kieses utan visszater,
      illetve 6 orankent halokent. A script maga donti el, mit kell potolni:
      lekerdezi a meglevo oras statisztikakat, es csak a hianyzo orakat irja be.
    mode: single
    max_exceeded: silent
    triggers:
      # A kieses vege. A `for` azert kell, hogy egy villano helyreallas ne
      # inditsa el feleslegesen; a `not_to` pedig azert, hogy az
      # unavailable -> unknown atmenet ne szamitson helyreallasnak.
      - trigger: state
        entity_id: sensor.d_tarifa_netto_energiadij
        from: "unavailable"
        not_to: "unknown"
        for: "00:02:00"
      # Halo: HA-ujrainditas, elmulasztott trigger, kesve erkezo adat eseten.
      # A script idempotens, ezert a felesleges futas nem kerul semmibe.
      - trigger: time_pattern
        hours: "/6"
        minutes: 20
    conditions:
      - condition: state
        entity_id: input_boolean.d_tarifa_auto_backfill
        state: "on"
      # Ha meg egyetlen ar sincs a tombben, nincs mit potolni.
      - condition: template
        value_template: "{{ states('sensor.hupx_arak') | int(0) > 0 }}"
    actions:
      - action: shell_command.d_tarifa_backfill
        response_variable: eredmeny
      - choose:
          # Tenylegesen potoltunk valamit - ez erdemel naplobejegyzest.
          - conditions:
              - condition: template
                value_template: >-
                  {{ eredmeny.returncode == 0
                     and 'KESZ: nincs' not in eredmeny.stdout }}
            sequence:
              - action: logbook.log
                data:
                  name: "D tarifa"
                  entity_id: sensor.d_tarifa_brutto_energiadij
                  # `splitlines()` es nem `split('\n')`: a YAML kettos idezojelben
                  # a \n valodi sortoresre alakulna, egyszeresben viszont nem -
                  # ez az alak mindkettotol fuggetlenul helyes.
                  message: >-
                    {{ (eredmeny.stdout.splitlines() or ['(nincs kimenet)']) | last }}
          # A 2-es visszateresi ertek nem hiba: az adatforras meg nem potolta az
          # adatot. Ilyenkor csendben varunk a kovetkezo futasig.
          - conditions:
              - condition: template
                value_template: "{{ eredmeny.returncode not in [0, 2] }}"
            sequence:
              - action: system_log.write
                data:
                  level: warning
                  logger: d_tarifa_backfill
                  message: >-
                    A visszamenoleges statisztika-potlas nem sikerult
                    (returncode {{ eredmeny.returncode }}):
                    {{ eredmeny.stderr or eredmeny.stdout }}
